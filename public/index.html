<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetZone — Online Meeting</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="lobby-body">
  <div class="lobby">
    <div class="lobby-card">
      <div class="logo">
        <i class="fa-solid fa-video"></i>
        <h1>Meet<span>Zone</span></h1>
      </div>
      <p class="tagline">Meeting online dengan mudah — video, audio, chat, dan screen sharing.</p>

      <div class="form-group">
        <label><i class="fa-solid fa-user"></i> Nama Anda</label>
        <input type="text" id="nameInput" placeholder="Masukkan nama..." maxlength="30">
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-door-open"></i> Kode Meeting</label>
        <div class="room-row">
          <input type="text" id="roomInput" placeholder="Kode meeting (kosongkan = buat baru)">
          <button id="newRoomBtn" title="Buat kode baru"><i class="fa-solid fa-shuffle"></i></button>
        </div>
      </div>

      <button id="joinBtn" class="btn-primary">
        <i class="fa-solid fa-right-to-bracket"></i> Gabung Meeting
      </button>

      <p class="error" id="error"></p>
    </div>

    <div class="features">
      <div class="feature"><i class="fa-solid fa-video"></i><span>HD Video Call</span></div>
      <div class="feature"><i class="fa-solid fa-display"></i><span>Screen Share</span></div>
      <div class="feature"><i class="fa-solid fa-comments"></i><span>Chat Realtime</span></div>
      <div class="feature"><i class="fa-solid fa-shield-halved"></i><span>P2P & Aman</span></div>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const roomInput = document.getElementById('roomInput');
    const joinBtn = document.getElementById('joinBtn');
    const newRoomBtn = document.getElementById('newRoomBtn');
    const errorEl = document.getElementById('error');

    // Simpan nama kalau pernah isi
    nameInput.value = localStorage.getItem('mz-name') || '';

    newRoomBtn.addEventListener('click', () => {
      roomInput.value = generateRoomId();
    });

    function generateRoomId() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let code = '';
      for (let i = 0; i < 3; i++) code += chars[Math.floor(Math.random() * chars.length)];
      code += '-';
      for (let i = 0; i < 4; i++) code += Math.floor(Math.random() * 10);
      return code;
    }

    joinBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      let roomId = roomInput.value.trim().toLowerCase();

      if (!name) {
        showError('Nama tidak boleh kosong!');
        return;
      }
      if (!roomId) roomId = generateRoomId();

      localStorage.setItem('mz-name', name);
      window.location.href = `/meeting/${roomId}?name=${encodeURIComponent(name)}`;
    });

    roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });

    function showError(msg) {
      errorEl.textContent = msg;
      setTimeout(() => errorEl.textContent = '', 3000);
    }
  </script>
</body>
</html>
